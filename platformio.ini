; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs =
    nodemcuv2
    vanilla_esp32
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of iotsa-board-defs.ini. Refresh both files whenever the iotsa dependency
; is bumped; do not hand-edit. App-specific choices stay in the [env:*] sections.
extra_configs =
    iotsa-board-traits.ini
    iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
    https://github.com/cwi-dis/iotsa.git#develop
    fmalpartida/LiquidCrystal
build_flags =
monitor_speed = 115200

; iotsa_v4 (ESP8266 nodemcuv2) -- the deployed hardware. 4m1m: 1MB filesystem +
; OTA scratch space (this app has IotsaOtaMod, so it cannot use the no-OTA 4m3m
; layout). The original hardware was an ESP-201 (no OTA); it has since been
; rebuilt on an iotsa_v4 board.
[env:nodemcuv2]
extends = iotsa_v4
board_build.ldscript = eagle.flash.4m1m.ld

; Build-only canary: no ESP32 LCD device exists, but keep an ESP32 target
; compiling against develop. vanilla_esp32 tracks iotsa's default board.
[env:vanilla_esp32]
extends = vanilla_esp32
board_build.partitions = min_spiffs.csv
